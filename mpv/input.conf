#UI Key Bindings
MBTN_RIGHT script-message-to menu show
/ cycle-values panscan 0 1
z cycle-values video-aspect-override "16:9" "4:3" "2.35:1" "no"
l cycle sub
\ cycle fullscreen
f cycle fullscreen
a cycle audio
m script-message denoise-cycle
RIGHT seek  5
LEFT  seek -5
SPACE cycle pause
PLAY cycle pause
PAUSE cycle pause
PLAYPAUSE cycle pause
PLAYONLY set pause no
PAUSEONLY set pause yes
NEXT playlist-next
PREV playlist-prev
FORWARD seek 60
REWIND seek -60
- add sub-scale -0.1
= add sub-scale +0.1
WHEEL_UP        add volume +2
WHEEL_DOWN      add volume -2
SHIFT+LEFT add chapter -1
SHIFT+RIGHT add chapter 1
MBTN_BACK playlist-prev
MBTN_FORWARD playlist-next
SHIFT+MBTN_BACK seek 0 absolute
n script-message sharpen-cycle

# Menu configuration for mpv-menu-plugin
# Right-click opens menu

# Sharpener submenu
_ script-message sharpen-off          #menu: Sharpener > Off #@state=get('user-data/streamee-sharpen-mode') == 'off' and 'checked' or ''
_ script-message sharpen-standard     #menu: Sharpener > Standard #@state=get('user-data/streamee-sharpen-mode') == 'standard' and 'checked' or ''
_ script-message sharpen-adaptive     #menu: Sharpener > Adaptive #@state=get('user-data/streamee-sharpen-mode') == 'adaptive' and 'checked' or ''
_ script-message sharpen-ultra        #menu: Sharpener > Ultra #@state=get('user-data/streamee-sharpen-mode') == 'ultra' and 'checked' or ''
_ script-message sharpen-ultra-custom #menu: Sharpener > UltraCustom #@state=get('user-data/streamee-sharpen-mode') == 'ultra-custom' and 'checked' or ''
_ script-message sharpen-open-options #menu: Sharpener > Sharpener Options...

# Denoiser submenu
_ script-message denoise-off            #menu: Denoiser > Off
_ script-message denoise-bilateral      #menu: Denoiser > Bilateral
_ script-message denoise-hqdn3d-toggle  #menu: Denoiser > HQDN3D #@state=get('user-data/streamee-hqdn3d-enabled') == 1 and 'checked' or ''
_ script-message denoise-bm3dcuda-luma     #menu: Denoiser > BM3D CUDA > Luma Spatial #@state=get('user-data/streamee-bm3dcuda-luma-enabled') == 1 and 'checked' or ''
_ script-message denoise-bm3dcuda-color    #menu: Denoiser > BM3D CUDA > Full Color Spatial #@state=get('user-data/streamee-bm3dcuda-color-enabled') == 1 and 'checked' or ''
_ script-message denoise-bm3dcuda-temporal #menu: Denoiser > BM3D CUDA > Luma Temporal #@state=get('user-data/streamee-bm3dcuda-temporal-enabled') == 1 and 'checked' or ''
_ script-message denoise-bm3dcuda-quality  #menu: Denoiser > BM3D CUDA > Two-stage Quality #@state=get('user-data/streamee-bm3dcuda-quality-enabled') == 1 and 'checked' or ''
_ ignore                                   #menu: Denoiser > BM3D CUDA > -
_ script-message bm3dcuda-profile-realtime #menu: Denoiser > BM3D CUDA > Processing Profile > Realtime #@state=get('user-data/streamee-bm3dcuda-profile-realtime-enabled') == 1 and 'checked' or ''
_ script-message bm3dcuda-profile-balanced #menu: Denoiser > BM3D CUDA > Processing Profile > Balanced #@state=get('user-data/streamee-bm3dcuda-profile-balanced-enabled') == 1 and 'checked' or ''
_ script-message bm3dcuda-profile-maximum  #menu: Denoiser > BM3D CUDA > Processing Profile > Maximum #@state=get('user-data/streamee-bm3dcuda-profile-maximum-enabled') == 1 and 'checked' or ''
_ ignore                                #menu: Denoiser > -
_ script-message denoise-strength-low   #menu: Denoiser > Strength > Low #@state=get('user-data/streamee-denoise-strength-low-enabled') == 1 and 'checked' or ''
_ script-message denoise-strength-medium #menu: Denoiser > Strength > Medium #@state=get('user-data/streamee-denoise-strength-medium-enabled') == 1 and 'checked' or ''
_ script-message denoise-strength-high  #menu: Denoiser > Strength > High #@state=get('user-data/streamee-denoise-strength-high-enabled') == 1 and 'checked' or ''

# RTX Video submenu (available when RTX VSR is the selected upscaler)
_ script-message-to streamee_vsr toggle-vsr #menu: RTX Video > VSR Upscaling #@state=(get('user-data/streamee-vsr-available') ~= 1 and 'disabled') or (get('user-data/streamee-vsr-enabled') == 1 and 'checked') or ''
_ script-message-to streamee_vsr toggle-hdr #menu: RTX Video > HDR Enhancement #@state=(get('user-data/streamee-vsr-available') ~= 1 and (get('user-data/streamee-rtx-hdr-enabled') == 1 and 'disabled,checked' or 'disabled')) or (get('user-data/streamee-rtx-hdr-enabled') == 1 and 'checked') or ''

# Main context menu
_ ignore #menu: -
_ ignore #menu: Video Tracks #@tracks/video
_ ignore #menu: Audio Tracks #@tracks/audio
_ ignore #menu: Subtitles #@tracks/sub
_ ignore #menu: Secondary subtitles #@tracks/sub-secondary
_ ignore #menu: -
_ set speed 0.5 #menu: Playback > Speed > 0.5x #@state=(math.abs((tonumber(speed) or 1) - 0.5) < 0.001 and 'checked') or ''
_ set speed 0.75 #menu: Playback > Speed > 0.75x #@state=(math.abs((tonumber(speed) or 1) - 0.75) < 0.001 and 'checked') or ''
_ set speed 1.0 #menu: Playback > Speed > Normal (1.0x) #@state=(math.abs((tonumber(speed) or 1) - 1.0) < 0.001 and 'checked') or ''
_ set speed 1.25 #menu: Playback > Speed > 1.25x #@state=(math.abs((tonumber(speed) or 1) - 1.25) < 0.001 and 'checked') or ''
_ set speed 1.5 #menu: Playback > Speed > 1.5x #@state=(math.abs((tonumber(speed) or 1) - 1.5) < 0.001 and 'checked') or ''
_ set speed 2.0 #menu: Playback > Speed > 2.0x #@state=(math.abs((tonumber(speed) or 1) - 2.0) < 0.001 and 'checked') or ''
_ set video-aspect-override no #menu: Playback > Aspect Ratio > Default #@state=((tonumber(get('video-aspect-override')) or -2) == -2 and 'checked') or ''
_ set video-aspect-override 16:9 #menu: Playback > Aspect Ratio > 16:9 #@state=(math.abs((tonumber(get('video-aspect-override')) or -2) - (16/9)) < 0.001 and 'checked') or ''
_ set video-aspect-override 4:3 #menu: Playback > Aspect Ratio > 4:3 #@state=(math.abs((tonumber(get('video-aspect-override')) or -2) - (4/3)) < 0.001 and 'checked') or ''
_ set video-aspect-override 2.35:1 #menu: Playback > Aspect Ratio > 2.35:1 #@state=(math.abs((tonumber(get('video-aspect-override')) or -2) - 2.35) < 0.001 and 'checked') or ''
_ ignore #menu: Playback > -
_ cycle fullscreen #menu: Playback > Fullscreen #@state=(fullscreen and 'checked')
_ async screenshot #menu: Playback > Take Screenshot #@state=(tonumber(vid) or 'disabled')
_ add sub-delay -0.1 #menu: Sync > Subtitles > 100 ms Earlier
_ set sub-delay 0 #menu: Sync > Subtitles > Reset
_ add sub-delay 0.1 #menu: Sync > Subtitles > 100 ms Later
_ add audio-delay -0.1 #menu: Sync > Audio > 100 ms Earlier
_ set audio-delay 0 #menu: Sync > Audio > Reset
_ add audio-delay 0.1 #menu: Sync > Audio > 100 ms Later
_ ignore #menu: Chapters #@chapters
_ ignore #menu: Editions #@editions
_ ignore #menu: Playlist #@playlist
_ ignore #menu: -
_ ignore #menu: Audio devices #@audio-devices
_ cycle ontop #menu: Always on top #@state=ontop and 'checked' or ''
_ ignore #menu: -
_ script-binding stats/display-page-1-toggle #menu: Stats for nerds
_ script-binding stats/display-page-5-toggle #menu: File info
_ ignore #menu: -
_ script-binding select/select-binding #menu: Key bindings
_ script-binding stats/display-page-4-toggle #menu: Help
