#
# THIS FILE WILL BE OVERWRITTEN WITH THE PACKAGE UPDATE
# Use %APPDATA%/mpv/mpv.conf
# OR SVP's menu -> Information -> Add. information -> mpv config. file
#     to define your own customized configuration
#
# Sample mpv configuration
#

# this is required for SVP to "catch" the mpv
# scripts\mpvSockets.lua can override this to allow several mpv windows at the same time
input-ipc-server=mpvpipe

# hardware video decoder
hwdec=auto-copy
hwdec-codecs=all

vo=gpu-next
gpu-api=d3d11

# high quality video output, require rather fast video card
#profile=gpu-hq

# this is for HDR passthrough on supported displays
target-colorspace-hint=auto

# use VULKAN API if you have problems with the default d3d11 renderer
# also turn off 'target-colorspace-hint' above!
#gpu-api=vulkan

# Shaders are managed by Streamee via --glsl-shader arg and IPC
# Do NOT add glsl-shader lines here — they will conflict with the app's sharpener

# Streamee provides its own custom OSC
osc=no
window-dragging=no

# comment this one if you want mpv to remember the playback position
save-position-on-quit=no
save-watch-history=yes
write-filename-in-watch-later-config=yes

# fixes audio desync
hr-seek-framedrop=no

# "ReClock" replacement
#video-sync=display-resample
#video-sync-max-video-change=5

#log-file=mpv.log

# Audio output configuration
# To find available audio devices, run: mpv --audio-device=help
#ao=wasapi
#audio-device=wasapi/{5a126d64-ae95-4f3f-a7b9-80d5e6ef9741}
