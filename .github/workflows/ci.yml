name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (Node ${{ matrix.node-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.19.0, 22.12.0]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Run focused frontend tests
        if: matrix.node-version == '22.12.0'
        run: |
          npm run test:anime-filter
          npm run test:xrel
          npm run test:logging
          npm run test:direct-failover

  rust:
    name: Rust
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
