[package]
name = "streamee"
version = "2.0.6"
description = "A Windows desktop media application with user-configured stream add-ons and MPV playback"
authors = [""]
license = "GPL-3.0-or-later"
edition = "2021"

[lib]
name = "streamee_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = ["devtools"] }
tauri-plugin-store = "=2.4.4"
tauri-plugin-dialog = "=2.6.0"
tauri-plugin-updater = "=2.10.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "rt", "io-util", "process", "time"] }
parking_lot = "0.12"
once_cell = "1"
regex = "1"
reqwest = { version = "0.11", features = ["json", "blocking", "multipart"] }
urlencoding = "2"
dirs = "5"
raw-window-handle = "0.6"
sha1 = "0.10"
discord-rich-presence = "1.1.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Devices_Display", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_Accessibility", "Win32_System_Threading", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_System_IO", "Win32_System_Pipes", "Win32_Storage_FileSystem", "Win32_Security", "Win32_Security_Credentials", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints"] }
webview2-com = "0.38.2"

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
